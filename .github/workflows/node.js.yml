# This workflow will build and test the SAP CAP bookstore application
# Runs on every push to main branch to ensure application quality

name: SAP CAP Bookstore CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        
    - name: Install dependencies
      working-directory: ./bookstore
      run: npm install
      
    - name: Install CAP CLI globally
      run: npm install -g @sap/cds-dk
      
    - name: Verify CAP installation
      run: cds version
      
    - name: Build CAP application
      working-directory: ./bookstore
      run: cds build
      
    - name: Run tests
      working-directory: ./bookstore
      run: npm test
      
    - name: Test application with cds watch
      working-directory: ./bookstore
      run: |
        echo "Starting CAP application with cds watch..."
        cds watch --in-memory &
        CDS_PID=$!
        
        # Wait for application to start
        echo "Waiting for application to start..."
        for i in {1..30}; do
          if curl -f http://localhost:4004/ 2>/dev/null; then
            echo "✅ Application is running!"
            break
          fi
          echo "Attempt $i: Application not ready yet, waiting..."
          sleep 2
        done
        
        # Test application endpoints
        echo "Testing application endpoints..."
        curl -f http://localhost:4004/ || exit 1
        curl -f http://localhost:4004/\$metadata || exit 1
        echo "✅ All endpoint tests passed!"
        
        # Clean up
        kill $CDS_PID || true